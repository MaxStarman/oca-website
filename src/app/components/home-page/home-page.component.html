<nav-menu-overlay></nav-menu-overlay>

<div class="home-bg d-flex justify-content-center align-items-center">
    <!-- TODO(phase 2): <oca-stage> with the 3D cupcake goes here, as a layer behind the logo -->
    <div class="text-center">
        <!-- No hint text on purpose: cursor, hover glow and the idle pulse say "click me" -->
        <button (click)="onLogoClick()"
                [attr.aria-label]="'nav.openMenu' | t"
                [class.is-hinting]="showHint"
                [class.is-pressed]="pressed"
                class="logo-button"
                type="button">
            <img alt="One Cupcake Away" class="logo-img" src="assets/images/oca-main.png"/>
        </button>

        <p class="intro fs-5 m-0 px-3 py-2">
            <b>{{ 'home.intro' | t }}<br/><span lang="sl">{{ signature }}</span></b>
        </p>
        <!-- TODO(audio): first logo tap may also start the preview track (MP3s to be provided) -->
    </div>
</div>
