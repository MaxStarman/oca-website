<nav-menu-overlay></nav-menu-overlay>

<!-- Dry-earth backdrop, fixed behind the page -->
<div aria-hidden="true" class="backdrop"></div>

<div [class.is-logo-hovered]="logoHovered" [class.is-paused]="navOpen" class="home-body">
    <!-- Psychedelic 70s stripes flowing down the sides of the page: the left one flows down, its mirror up -->
    <div aria-hidden="true" class="ribbon ribbon--left"><div class="ribbon-flow"></div></div>
    <div aria-hidden="true" class="ribbon ribbon--right"><div class="ribbon-flow"></div></div>

    <section class="hero d-flex justify-content-center align-items-center">
        <!-- No hint text on purpose: cursor, hover glow and the idle pulse say "click me" -->
        <button (blur)="logoHovered = false"
                (click)="onLogoClick()"
                (focus)="logoHovered = true"
                (mouseenter)="logoHovered = true"
                (mouseleave)="logoHovered = false"
                [attr.aria-expanded]="navOpen"
                [attr.aria-label]="'nav.openMenu' | t"
                aria-haspopup="dialog"
                [class.is-hinting]="showHint"
                [class.is-pressed]="pressed"
                class="logo-button"
                type="button">
            <img alt="One Cupcake Away" class="logo-img" fetchpriority="high" height="258" src="assets/images/oca-main.webp"
                 width="364"/>
        </button>
        <!-- TODO(audio): first logo tap may also start the preview track (MP3s to be provided);
             the side stripes could then pulse with the music -->

        <icon class="scroll-cue" name="arrow-down"></icon>
    </section>

    <!-- Pinned scroll scene: the lines arrive one at a time, like verses being played -->
    <section #manifesto class="manifesto">
        <div class="manifesto-pin">
            <p *ngFor="let key of lines" class="line">{{ key | t }}</p>
            <p class="line signature" lang="sl">{{ signature }}</p>
        </div>
    </section>

    <instrument-orbit></instrument-orbit>
</div>

<section class="footer">
    <nav-menu></nav-menu>
</section>
