<div>
    <!-- Both are on screen during the hand-over: the content fades in over the fading start page -->
    <contact-start-page (clicked)="onStartPageDone()" *ngIf="showStartPage" [class.is-fading-out]="showContent"></contact-start-page>
    <content *ngIf="showContent" class="is-fading-in"></content>
</div>
