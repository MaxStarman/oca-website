<section class="base-bg" id="intro-section">
    <!-- TODO v celoti je potrebno preuredit -> html/scss   -->
    <div class="sticky-top">
        <div class="header">
            <div class="heading">
                <h1>
                    {{ 'contact.titleLine1' | t }} <br> {{ 'contact.titleLine2' | t }}
                </h1>
            </div>

            <img alt="" class="main-bg-image" src="/assets/images/contact-us/contact-start.jpeg">
            <div class="band-img">
                <div class="band-particles">
                    <!-- --i staggers their entrance (band-rise in the SCSS) -->
                    <img alt="" id="cink" src="../../../../assets/images/contact-us/band-particles/cink.png" style="--i: 0">
                    <img alt="" id="vid" src="../../../../assets/images/contact-us/band-particles/vid.png" style="--i: 1">
                    <img alt="" id="maj" src="../../../../assets/images/contact-us/band-particles/maj.png" style="--i: 2">
                    <img alt="" id="miha" src="../../../../assets/images/contact-us/band-particles/miha.png" style="--i: 3">
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container text-center mx-4">
            <p class="fs-3">{{ 'contact.body' | t }}</p>
        </div>
    </div>
</section>

<section #contactSection id="contact-section">
    <div class="container contact-info sticky-top">
        <div #item class="phone-number">
            <i class="fa-solid fa-phone fa-2xl"></i>
            <h1 class="fs-4">
                <a class="phone-link" href="tel:+38641531196">
                    +386 41 531 196
                </a>
            </h1>
        </div>
        <div #item class="email">
            <i class="fa-regular fa-envelope fa-2xl"></i>
            <h1 class="fs-4">
                <a class="mail-link" href="mailto:ocaband@protonmail.com">
                    OCABAND&#8203;@PROTONMAIL&#8203;.COM
                </a>
            </h1>
        </div>
        <div #item class="location">
            <i class="fa-solid fa-map-pin fa-2xl"></i>
            <h1 class="fs-4">{{ 'contact.location' | t }}</h1>
        </div>
    </div>
</section>


<section>
    <nav-menu></nav-menu>
</section>
