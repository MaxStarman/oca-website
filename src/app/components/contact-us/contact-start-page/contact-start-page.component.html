<button (click)="onClick()" (scrollIntent)="onClick()" class="bg-image" type="button">
    <span class="title-container">
        <!-- A heading isn't allowed inside a button; the real <h1> is on the page that follows -->
        <span class="title">
            {{ 'contact.titleLine1' | t }} <br> {{ 'contact.titleLine2' | t }}
        </span>
        <!-- "Go on": a click, scroll or swipe continues (scrollIntent) -->
        <icon aria-hidden="true" class="continue-cue" name="arrow-down"></icon>
    </span>
</button>
