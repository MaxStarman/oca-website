<div (keydown)="onKeydown($event)"
     [attr.aria-label]="'nav.main' | t"
     [class.open]="isOpen"
     aria-modal="true"
     class="nav overlay"
     role="dialog">

    <button #closeButton (click)="close()" [attr.aria-label]="'nav.closeMenu' | t" class="close-button" type="button">
        <icon name="xmark"></icon>
    </button>

    <nav-menu></nav-menu>
</div>
