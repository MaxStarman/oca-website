<nav-icon
    *ngIf="isFromOverlay"
    [type]="'nav-menu'"
></nav-icon>

<div class="background-video-container">
    <!-- Plays only while at least half visible (see ngAfterViewInit). preload="metadata" keeps the
         footers from downloading the whole file up front.
         TODO(content): add poster="assets/videos/oca-nav-poster.jpg" once the video is re-encoded. -->
    <video #bgVideo aria-hidden="true" class="background-video" loop muted playsinline preload="metadata">
        <source src="./assets/videos/oca-nav-video.mp4" type="video/mp4">
    </video>

    <div [attr.aria-label]="'lang.label' | t" class="lang-toggle" role="group">
        <button (click)="i18n.setLang('sl')" [attr.aria-pressed]="i18n.lang === 'sl'" lang="sl" type="button">SL</button>
        <span aria-hidden="true">/</span>
        <button (click)="i18n.setLang('en')" [attr.aria-pressed]="i18n.lang === 'en'" lang="en" type="button">EN</button>
    </div>

    <div class="links">
        <button (click)="onLinkClick($event, '/news')"
                class="menu-link col-md-4 d-flex flex-column justify-content-center align-items-center mobile-animation"
                type="button">
            <img [height]="76" [width]="87" alt="" ngSrc="../../../../assets/svg-icons/alert-white.svg">
            <h1>{{ 'nav.news' | t }}</h1>
        </button>

        <button (click)="onLinkClick($event, '/music')"
                class="menu-link col-md-4 d-flex flex-column justify-content-center align-items-center mobile-animation"
                type="button">
            <img [height]="74" [width]="48" alt="" ngSrc="../../../../assets/svg-icons/note-white.svg">
            <h1>{{ 'nav.music' | t }}</h1>
        </button>

        <button (click)="onLinkClick($event, '/contact')"
                class="menu-link col-md-4 d-flex flex-column justify-content-center align-items-center mobile-animation"
                type="button">
            <img [height]="74" [width]="93" alt="" ngSrc="../../../../assets/svg-icons/mail-white.svg">
            <h1>{{ 'nav.contact' | t }}</h1>
        </button>
    </div>

</div>
