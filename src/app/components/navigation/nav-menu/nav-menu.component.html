<div class="background-video-container">
    <!-- Plays only while at least half visible (see ngAfterViewInit), and loads nothing before that:
         this MP4 keeps its index at the end of the file, so even preload="metadata" pulled ~3 MB per page.
         TODO(content): add poster="assets/videos/oca-nav-poster.jpg" once the video is re-encoded. -->
    <video #bgVideo aria-hidden="true" class="background-video" loop muted playsinline preload="none">
        <source src="./assets/videos/oca-nav-video.mp4" type="video/mp4">
    </video>

    <!-- The big menu: every item named, the current page marked in its own color -->
    <div class="links">
        <a (click)="nav.scrollUpIfCurrent(link.path)"
           *ngFor="let link of links"
           [routerLink]="link.path"
           [style.--accent]="link.accent"
           ariaCurrentWhenActive="page"
           class="menu-link"
           routerLinkActive="is-current">
            <img [height]="link.iconHeight" [ngSrc]="link.icon" [width]="link.iconWidth" alt="">
            <span class="menu-label">{{ link.label | t }}</span>
        </a>
    </div>
</div>
