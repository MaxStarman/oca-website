<section id="featured-post-section">
    <div class="header-bg-image sticky-top instagram-feed">
        <div *ngIf="status === 'loading'" class="spinner-border text-light" role="status">
            <span class="visually-hidden">{{ 'news.loading' | t }}</span>
        </div>

        <div *ngIf="status === 'error' || status === 'empty'" class="feed-message">
            <h1 class="fs-4">
                {{ (status === 'error' ? 'news.error' : 'news.empty') | t }}
            </h1>
            <a [href]="instagramUrl" class="instagram-link" rel="noopener" target="_blank">
                <icon name="instagram"></icon> {{ 'news.seeOnInstagram' | t }}
            </a>
        </div>

        <div *ngIf="status === 'ready' && selectedPost" class="post-content">
            <ng-container *ngIf="selectedPost.media_type === 'CAROUSEL_ALBUM'">
                <!-- Auto-advances every 5 s, except with reduced motion -->
                <carousel [interval]="carouselInterval">
                    <slide *ngFor="let child of selectedPost.children.data">
                        <img *ngIf="child.media_type === 'IMAGE'" [src]="child.media_url"
                             alt="" class="carousel-image"/>
                        <video *ngIf="child.media_type === 'VIDEO'" [src]="child.media_url"
                               class="carousel-video" controls loop playsinline preload="metadata"></video>
                    </slide>
                </carousel>
            </ng-container>

            <ng-container
                *ngIf="selectedPost.media_type === 'VIDEO' && selectedPost.media_type !== 'CAROUSEL_ALBUM'">
                <video [src]="selectedPost.media_url" class="single-video" controls muted></video>
            </ng-container>

            <ng-container
                *ngIf="selectedPost.media_type === 'IMAGE' && selectedPost.media_type !== 'CAROUSEL_ALBUM'">
                <img [src]="selectedPost.media_url" alt="" class="single-image"/>
            </ng-container>
        </div>
    </div>

    <div class="pages-base-bg-image">
        <div *ngIf="selectedPost && selectedPost.caption" class="container post-caption">
            <p class="fs-3">
                {{ selectedPost.caption }}
            </p>

            <p>{{ selectedPost.timestamp | date: 'longDate' : undefined : i18n.locale }}</p>

            <!--            <a [href]="selectedPost.permalink" class="mt-2 fs-5 w-fit-content" target="_blank">-->
            <!--                View on Instagram <i class="fa-brands fa-instagram mx-1"></i>-->
            <!--            </a>-->
            <icon class="animate" name="arrow-down"></icon>
        </div>
    </div>
</section>


<section #morePosts id="more-posts-section">
    <div class="container more-posts">
        <div *ngIf="otherPosts.length > 0" class="post-grid">
            <button #card
                    (click)="viewPost(post.id)"
                    *ngFor="let post of otherPosts"
                    class="oca-card post-card"
                    type="button">
                <img [alt]="'news.otherPostAlt' | t" [src]="getImageSource(post)" class="post-thumbnail">
            </button>
        </div>
        <div #card class="shameless-plug">
            <a [href]="instagramUrl" class="instagram-link mb-2" rel="noopener" target="_blank">
                <icon name="instagram"></icon> {{ 'news.followOnInstagram' | t }}
            </a>
        </div>
    </div>


</section>

<section>
    <nav-menu></nav-menu>
</section>
