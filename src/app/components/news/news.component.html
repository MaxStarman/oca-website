<div>
    <!-- Both are on screen during the hand-over: the start page shatters (or fades) over the posts -->
    <news-start-page (clicked)="onStartPageDone()" *ngIf="showStartPage" [class.is-fading-out]="showPosts && fadeOut"></news-start-page>
    <display-posts *ngIf="showPosts" class="is-fading-in"></display-posts>
</div>
